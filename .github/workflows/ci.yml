name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q backend scripts tests

      - name: Check dependency manifests
        run: python tests/dependency_manifest_test.py

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Validate frontend DOM contract and scientific states
        run: python tests/frontend_contract_test.py

      - name: Test verified asset bootstrap
        run: python tests/bootstrap_test.py

      - name: Test keyless Vercel OIDC authentication
        run: python tests/oidc_auth_test.py

      - name: Test four-horizon inference and API
        run: python tests/smoke_test.py

      - name: Test paired 2023 comparison archive
        run: python tests/comparison_archive_test.py

      - name: Test safe comparison error classification
        run: python tests/comparison_error_test.py
